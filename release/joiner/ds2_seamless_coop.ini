# DS2 Seamless Co-op 0.2.1 - settings of the player who JOINS a friend
# Настройки того, кто ПОДКЛЮЧАЕТСЯ к другу
#
# server_ip: the host's Radmin VPN address - the host's StartServer window shows it.
# server_ip: адрес хоста в Radmin VPN - его показывает окно StartServer у хоста.
use_custom_server=true
server_ip=26.X.X.X
server_port=50031

# Joining through the menu places your sign and gets you summoned by itself
# Подключение через меню само ставит знак, и хост призывает тебя сам
auto_summon=true
# Your sign appears right under the host's feet
# Твой знак появляется прямо у хоста под ногами
sign_under_feet=true
# Resting at a bonfire brings the enemies back for everyone
# Отдых у костра возвращает врагов у всех
rest_sync=true
# In the host's world you loot items and chests; the loot is yours and is gone from your own world too
# В мире хоста ты собираешь предметы и сундуки; добыча твоя, и в твоём мире её потом тоже нет
loot_sync=true
# No co-op fog walls between areas; going through them keeps the co-op
# Нет кооп-тумана между локациями; переход не рвёт кооп
free_travel=true
# If you die you come back to the host's world (in a boss fight - once the fight is over)
# Погиб - вернёшься в мир хоста (на боссе - когда бой закончится)
death_respawn=true
# Invasions / Вторжения
allow_invasions=false

# Menu: language auto/en/ru and the key that opens it (Insert always works too)
# Меню: язык auto/en/ru и клавиша (Insert работает всегда)
language=auto
menu_key=F1

# Full log in ds2_seamless_coop.log - keep it on, bug reports need it
# Подробный лог ds2_seamless_coop.log - не выключай, по нему разбирают ошибки
debug_logging=true
# Test keys (F2-F11 and others) - leave off / Тестовые клавиши - не включать
debug_hotkeys=false

# Shared progress. Bonfires, fog gates, bosses and picked-up items are event
# flags: they travel both ways, and when you join, the host hands you everything
# it has already done. This writes into your save - your whole flag table is
# saved to ds2_flags_backup.bin before the first write. off = your save is not
# touched, and the host does not get your progress either.
# Общий прогресс. Костры, туманы, боссы и подобранные предметы - это флаги
# событий: они идут в обе стороны, а при входе хост отдаёт тебе всё, что уже
# прошёл. Это запись в твой сейв - перед первой записью вся твоя таблица флагов
# сохраняется в ds2_flags_backup.bin. off = твой сейв не трогают, но и хост
# твоего прогресса не получит.
flag_sync=on

enabled=true
max_players=6
port=27015
sync_bonfires=true
sync_items=false
sync_enemies=false
