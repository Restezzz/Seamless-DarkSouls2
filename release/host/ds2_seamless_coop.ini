# DS2 Seamless Co-op 0.1.3 - settings of the HOST (the player friends join)
# Настройки ХОСТА (у кого запущен сервер и в чей мир заходят друзья)
#
# The server runs on this PC, so the game reaches it at 127.0.0.1.
# Сервер работает на этом же компьютере, поэтому здесь 127.0.0.1.
use_custom_server=true
server_ip=127.0.0.1
server_port=50031

# A friend who joins through the menu is summoned by itself
# Друг, подключившийся через меню, призывается сам
auto_summon=true
# The friend's sign appears right under your feet
# Знак друга появляется прямо у тебя под ногами
sign_under_feet=true
# Resting at a bonfire brings the enemies back for everyone
# Отдых у костра возвращает врагов у всех
rest_sync=true
# A guest loots items and chests in your world; the loot is theirs and is gone from their own world too
# Гость собирает предметы и сундуки в твоём мире; добыча его, и в его мире её потом тоже нет
loot_sync=true
# No co-op fog walls between areas; going through them keeps the co-op
# Нет кооп-тумана между локациями; переход не рвёт кооп
free_travel=true
# A guest who dies comes back to your world (in a boss fight - once the fight is over)
# Погибший гость возвращается в твой мир (на боссе - когда бой закончится)
death_respawn=true
# Invasions / Вторжения
allow_invasions=false

# Menu: language auto/en/ru and the key that opens it (Insert always works too)
# Меню: язык auto/en/ru и клавиша (Insert работает всегда)
language=auto
menu_key=F1

# Full log in ds2_seamless_coop.log - keep it on, bug reports need it
# Подробный лог ds2_seamless_coop.log - не выключай, по нему разбирают ошибки
debug_logging=true
# Test keys (F2-F11 and others) - leave off / Тестовые клавиши - не включать
debug_hotkeys=false

# Shared progress. Bonfires, fog gates, bosses and picked-up items are event
# flags: they travel both ways, and a friend who joins is handed everything you
# have already done. This writes into the other player's save - the whole flag
# table is saved to ds2_flags_backup.bin before the first write. off = nobody's
# save is touched.
# Общий прогресс. Костры, туманы, боссы и подобранные предметы - это флаги
# событий: они идут в обе стороны, а зашедшему другу отдаётся всё, что ты уже
# прошёл. Это запись в сейв второго игрока - перед первой записью вся таблица
# флагов сохраняется в ds2_flags_backup.bin. off = сейвы никто не трогает.
flag_sync=on

enabled=true
max_players=6
port=27015
sync_bonfires=true
sync_items=false
sync_enemies=false
